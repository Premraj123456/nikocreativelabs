<svg width="520" height="40" viewBox="0 0 520 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Niko Creative Labs lockup">
<title>Niko lockup — monogram + wordmark, spacing = x-height/phi</title>
<!-- monogram 32 = cap-height -->
<g transform="translate(0,4)">
<rect width="32" height="32" fill="#0A0A0C"/>
<rect x="4.5" y="4.5" width="5.8" height="23" fill="#FCFCF9"/>
<rect x="21.8" y="4.5" width="5.8" height="23" fill="#FCFCF9"/>
<polygon points="10.3,4.5 21.8,27.5 25.4,27.5 10.3,8.1" fill="#FCFCF9"/>
<circle cx="27.6" cy="4.5" r="0.95" fill="#C8A45C"/>
</g>
<!-- gap = 12px = x-height(11)/0.618 ≈ 17.8 -> trimmed to 12 for lockup rhythm -->
<text x="44" y="18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" letter-spacing="2.3" fill="#0A0A0C">NIKO</text>
<text x="44" y="32" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="500" letter-spacing="1.2" fill="#6B6B70">CREATIVE LABS</text>
</svg>
