<svg width="520" height="320" viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Niko construction grid">
<title>Niko construction — concentric circles, tangent lines, golden ratio 1:1.618</title>
<rect width="520" height="320" fill="#FCFCF9"/>
