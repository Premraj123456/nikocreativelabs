<!-- grid -->
<g opacity="0.12" stroke="#0A0A0C" stroke-width="0.6" fill="none">
<rect x="16" y="36" width="200" height="200" />
<circle cx="116" cy="136" r="100" />
<circle cx="116" cy="136" r="61.8" />
<circle cx="116" cy="136" r="38.2" />
<line x1="16" y1="136" x2="216" y2="136" />
<line x1="116" y1="36" x2="116" y2="236" />
<line x1="46" y1="66" x2="186" y2="206" stroke-dasharray="3 3"/>
</g>
<!-- N on grid -->
<g transform="translate(16,36)">
<rect x="28" y="28" width="36" height="144" fill="#0A0A0C" opacity="0.08"/>
<rect x="136" y="28" width="36" height="144" fill="#0A0A0C" opacity="0.08"/>
<polygon points="64,28 136,172 158.2,172 64,50.2" fill="#0A0A0C" opacity="0.08"/>
<!-- final N -->
<rect x="28" y="28" width="36" height="144" fill="none" stroke="#0A0A0C" stroke-width="1.5"/>
<rect x="136" y="28" width="36" height="144" fill="none" stroke="#0A0A0C" stroke-width="1.5"/>
<polygon points="64,28 136,172 158.2,172 64,50.2" fill="none" stroke="#C8A45C" stroke-width="1.5"/>
<circle cx="172" cy="28" r="6" fill="none" stroke="#C8A45C" stroke-width="1"/>
</g>
<!-- specs right -->
<g font-family="JetBrains Mono, monospace" font-size="9" fill="#0A0A0C">
<text x="260" y="60" font-weight="600">MATHEMATICS</text>
<text x="260" y="76" fill="#6B6B70">Base unit u = 100 — Outer square 100</text>
<text x="260" y="90" fill="#6B6B70">N width = 100 / 1.618 = 61.8 — centered</text>
<text x="260" y="104" fill="#6B6B70">Stem 18 = u/5.56 — Diagonal 11.1 = 18/1.618</text>
<text x="260" y="118" fill="#6B6B70">Circles 100 / 61.8 / 38.2 — tangent joints, no breaks</text>
<text x="260" y="140" font-weight="600">PSYCHOLOGY</text>
<text x="260" y="156" fill="#6B6B70">Square = stability — Circle = unity</text>
<text x="260" y="170" fill="#6B6B70">High contrast B&amp;W first — brass as accent only</text>
<text x="260" y="184" fill="#6B6B70">Spacing = x-height / 1.618 — optical overshoot +2px</text>
<text x="260" y="206" font-weight="600">USAGE — LAB 001</text>
<text x="260" y="222" fill="#6B6B70">16px favicon ✓  32px app icon ✓  10m billboard ✓</text>
<text x="260" y="236" fill="#6B6B70">Embroidery • Deboss • Foil • Mono — no effects</text>
</g>
<rect x="16" y="256" width="488" height="1" fill="#E8E6E1"/>
<text x="16" y="280" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1" fill="#9A9AA0">NIKO CREATIVE LABS — INVISIBLE AI — LAB 001 — BUILD A NOT FOR A SEASON, FOR DECADES</text>
