<svg width="520" height="80" viewBox="0 0 520 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NIKO CREATIVE LABS wordmark">
<title>NIKO CREATIVE LABS — geometric sans, 1.618 spacing</title>
<rect width="520" height="80" fill="none"/>
<!-- NIKO — 28px cap height, tracking 0.14em = 3.9px at 28px -->
<text x="0" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="4.8" fill="#0A0A0C">NIKO</text>
<!-- CREATIVE LABS — 11px mono, tracking 0.16em, optical baseline 54 -->
<text x="0" y="62" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.76" fill="#6B6B70">CREATIVE LABS</text>
<!-- brass rule 61.8% of NIKO width -->
<rect x="0" y="40" width="162" height="1.5" fill="#C8A45C"/>
</svg>
